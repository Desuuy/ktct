<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi Kinh tế chính trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Study booklet: ink-navy text on cool paper, textbook-crimson accent, gold for highlights */
  --bg:#f4f5f8; --surface:#ffffff; --ink:#18213a; --muted:#5d6680; --line:#dfe2ea;
  --accent:#a3202a; --accent-soft:#f8e7e8; --gold:#b7861c;
  --ok:#1f7a4a; --ok-soft:#e4f3ea; --bad:#b42318; --bad-soft:#fdecea;
  --done:#1f8a52; --flag:#7b4bc4; --flag-soft:#efe7fb;
  --font-display:"Lora", Georgia, serif;
  --font-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141c; --surface:#1a1f2b; --ink:#e8eaf1; --muted:#9aa2b8; --line:#2c3344;
    --accent:#ef6b73; --accent-soft:#3a1d22; --gold:#e0b452;
    --ok:#5fcf91; --ok-soft:#163325; --bad:#ff7b6e; --bad-soft:#3a1a18;
    --done:#3fb97a; --flag:#b48cf2; --flag-soft:#2d2342;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#1a1f2b; --ink:#e8eaf1; --muted:#9aa2b8; --line:#2c3344;
  --accent:#ef6b73; --accent-soft:#3a1d22; --gold:#e0b452;
  --ok:#5fcf91; --ok-soft:#163325; --bad:#ff7b6e; --bad-soft:#3a1a18;
    --done:#3fb97a; --flag:#b48cf2; --flag-soft:#2d2342;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.75rem}
h2{font-size:1.35rem}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top .back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px}
.eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.hero{display:grid;gap:6px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;text-align:left;color:var(--ink)}
button.card:hover{border-color:var(--accent)}
.card .num{font-family:var(--font-display);font-size:1.6rem;color:var(--accent);line-height:1}
.card .t{font-weight:600}
.pill{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.exam-card{border:2px solid var(--accent);background:var(--accent-soft);margin-bottom:12px;grid-template-columns:1fr auto;align-items:center}
.exam-card .go{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 18px 18px}
.notes h3{font-size:1.1rem;margin:18px 0 8px;color:var(--accent)}
.notes p,.notes li{max-width:68ch}
.notes ul,.notes ol{padding-left:20px;margin:6px 0}
.notes li{margin:4px 0}
.notes table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
.notes th,.notes td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.notes th{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.progress{flex:1;min-width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toggle{display:flex;gap:6px;align-items:center;font-size:.92rem;color:var(--muted)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;scroll-margin-top:80px}
.q .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.q .qn{font-weight:700;color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
.q .qt{font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.exp{margin-top:10px;padding:10px 12px;border-left:3px solid var(--gold);background:var(--bg);border-radius:0 8px 8px 0;font-size:.95rem}
.exp b{color:var(--gold)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;display:grid;gap:12px}
.score{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.score .big{font-family:var(--font-display);font-size:2.6rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
.breakdown{width:100%;border-collapse:collapse;font-size:.95rem}
.breakdown td{padding:6px 4px;border-bottom:1px solid var(--line)}
.breakdown td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:none;place-items:center;padding:16px;z-index:20}
.modal.show{display:grid}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:380px;width:100%;display:grid;gap:14px}
.notes a{color:var(--accent)}
.unv{display:inline-block;font-family:var(--font-body);font-size:.72rem;font-weight:600;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:0 8px;vertical-align:middle}
.tip{background:var(--accent-soft);padding:8px 12px;border-radius:8px}
div.opt{cursor:default}
.tabs{flex-wrap:wrap}
.grid.stats{grid-template-columns:repeat(4,1fr)}
.stats .card{padding:12px}.stats .num{font-size:1.6rem}
@media (max-width:640px){.grid.stats{grid-template-columns:repeat(2,1fr)}}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.hmain .t{font-weight:600}.hscore{display:grid;justify-items:end;gap:2px}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:560px){.hrow{grid-template-columns:1fr auto}.hrow .row{grid-column:1/-1}}
.hist-card{grid-template-columns:1fr auto;align-items:center}

/* ---- quiz layout: questions left, control panel right ---- */
.wrap:has(.quiz){max-width:1140px}
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.panel{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;max-height:calc(100vh - 24px);overflow:auto;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stats2{display:grid;grid-template-columns:1fr 1fr;padding-bottom:12px;border-bottom:1px solid var(--line)}
.stats2 div{display:grid;gap:2px;text-align:center;padding:0 6px}
.stats2 div+div{border-left:1px solid var(--line)}
.stats2 span{font-size:.8rem;color:var(--muted)}
.stats2 b{font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
#timer.warn{color:var(--bad)}
.gridwrap summary{cursor:pointer;font-weight:600;font-size:.92rem;list-style:none;display:flex;gap:6px;align-items:center;margin-bottom:10px}
.gridwrap summary::-webkit-details-marker{display:none}
.gridwrap summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.gridwrap[open] summary::before{transform:rotate(90deg)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:7px;margin-bottom:12px}
.navgrid button{aspect-ratio:1;width:100%;max-width:40px;justify-self:center;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.navgrid button:hover{border-color:var(--ink)}
.navgrid button.done{background:var(--done);border-color:var(--done);color:#fff}
.navgrid button.fl{background:var(--flag);border-color:var(--flag);color:#fff}
.navgrid button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.navgrid button.w{background:var(--bad);border-color:var(--bad);color:#fff}
.navgrid button.r.fl,.navgrid button.w.fl{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--flag)}
.navgrid button.r.fl{background:var(--ok)}.navgrid button.w.fl{background:var(--bad)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.88rem}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);flex:none}
.dot.done{background:var(--done);border-color:var(--done)}.dot.fl{background:var(--flag);border-color:var(--flag)}
.dot.r{background:var(--ok);border-color:var(--ok)}.dot.w{background:var(--bad);border-color:var(--bad)}
.dot.ring{background:var(--surface);box-shadow:inset 0 0 0 2px var(--flag)}
.submitbtn{width:100%;border-radius:99px;padding:11px 14px;font-size:1rem;position:sticky;bottom:0;box-shadow:0 -10px 12px -6px var(--surface)}
.tag{font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.flag{background:var(--flag-soft);color:var(--flag)}
.q.flagged{border-color:var(--flag);box-shadow:inset 4px 0 0 var(--flag)}
.flagbox{position:relative;display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:.9rem;cursor:pointer;user-select:none}
.flagbox input{position:absolute;opacity:0;width:1px;height:1px}
.flagbox i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.flagbox input:checked+i{background:var(--flag);border-color:var(--flag)}
.flagbox input:checked+i::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.flagbox input:checked~*{color:var(--flag)}
.flagbox:has(input:checked) span{color:var(--flag);font-weight:600}
.flagbox input:focus-visible+i{outline:2px solid var(--flag);outline-offset:2px}
@media (max-width:899px){
  .quiz{grid-template-columns:1fr;gap:12px}
  .panel{order:-1;top:0;z-index:6;border-radius:0 0 14px 14px;margin:0 -16px;padding:10px 16px;max-height:70vh;gap:8px}
  .stats2{padding-bottom:8px}.stats2 b{font-size:1.15rem}
  .navgrid{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
  .gridwrap summary{margin-bottom:6px}
  .submitbtn{padding:9px 14px}
  .q{scroll-margin-top:150px}
}
.foot{margin-top:28px;font-size:.88rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:420px){h1{font-size:1.45rem}.score .big{font-size:2.1rem}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<script>
const CHAPTERS = [
{
id: 1,
title: "Đối tượng, phương pháp nghiên cứu và chức năng của KTCT Mác – Lênin",
short: "Nhập môn KTCT",
notes: `
<h3>1. Lịch sử hình thành</h3>
<ul>
<li>Thuật ngữ <b>"kinh tế chính trị"</b> xuất hiện năm <b>1615</b> trong tác phẩm <i>Chuyên luận về kinh tế chính trị</i> của <b>Antoine de Montchrétien</b> (Pháp).</li>
<li><b>Chủ nghĩa trọng thương</b> (thế kỷ XV – XVII): của cải sinh ra từ <b>lưu thông, ngoại thương</b>.</li>
<li><b>Chủ nghĩa trọng nông</b> (nổi bật ở Pháp, thế kỷ XVIII): nhấn mạnh vai trò của <b>sản xuất nông nghiệp</b>, coi trọng sở hữu tư nhân và tự do kinh tế. Đại biểu: <b>F. Quesnay</b>, Turgot, Boisguillebert.</li>
<li><b>KTCT tư sản cổ điển Anh</b>: đại biểu <b>W. Petty</b>, <b>A. Smith</b> (<i>Của cải của các dân tộc</i>, 1776), <b>D. Ricardo</b>. Đóng góp lớn: lý thuyết <b>giá trị – lao động</b>.</li>
<li><b>KTCT Mác – Lênin</b>: C. Mác và Ph. Ăngghen kế thừa KTCT cổ điển Anh; lý luận thể hiện tập trung và cô đọng nhất trong <b>Bộ Tư bản</b>. Sau khi Mác, Ăngghen qua đời, <b>V.I. Lênin</b> tiếp tục kế thừa, bổ sung, phát triển (nhất là lý luận về CNTB độc quyền).</li>
</ul>
<h3>2. Đối tượng nghiên cứu</h3>
<p>Các <b>quan hệ xã hội của sản xuất và trao đổi</b>, đặt trong mối liên hệ biện chứng với trình độ phát triển của <b>lực lượng sản xuất</b> và <b>kiến trúc thượng tầng</b> tương ứng.</p>
<p><b>Mục đích:</b> phát hiện các <b>quy luật kinh tế</b> chi phối quan hệ giữa người với người trong sản xuất và trao đổi.</p>
<ul>
<li><b>Quy luật kinh tế</b>: mối liên hệ bản chất, khách quan, lặp đi lặp lại của các hiện tượng, quá trình kinh tế. Chỉ phát huy tác dụng thông qua hoạt động kinh tế của con người.</li>
<li><b>Chính sách kinh tế</b>: sản phẩm <b>chủ quan</b> của nhà nước, hình thành trên cơ sở vận dụng quy luật.</li>
</ul>
<h3>3. Phương pháp nghiên cứu</h3>
<ul>
<li>Phương pháp luận chung: <b>phép biện chứng duy vật</b>.</li>
<li>Phương pháp đặc thù, quan trọng nhất: <b>trừu tượng hóa khoa học</b> – gạt bỏ cái ngẫu nhiên, tạm thời; giữ lại cái bền vững, ổn định, điển hình.</li>
<li>Ngoài ra: logic kết hợp lịch sử, phân tích – tổng hợp, quy nạp – diễn dịch, thống kê, mô hình hóa…</li>
</ul>
<h3>4. Bốn chức năng</h3>
<ol>
<li><b>Nhận thức</b>: cung cấp hiểu biết về các quan hệ và quy luật kinh tế.</li>
<li><b>Thực tiễn</b>: vận dụng quy luật vào hoạt động kinh tế, giải quyết vấn đề thực tiễn.</li>
<li><b>Tư tưởng</b>: xây dựng thế giới quan khoa học, niềm tin vào mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.</li>
<li><b>Phương pháp luận</b>: nền tảng lý luận cho các khoa học kinh tế chuyên ngành.</li>
</ol>`,
qs: [
["Thuật ngữ \"kinh tế chính trị\" xuất hiện lần đầu năm nào, trong tác phẩm của ai?", ["Năm 1615, Antoine de Montchrétien", "Năm 1776, Adam Smith", "Năm 1758, François Quesnay", "Năm 1867, C. Mác"], 0, "Năm 1615, nhà kinh tế người Pháp Antoine de Montchrétien dùng thuật ngữ này trong tác phẩm 'Chuyên luận về kinh tế chính trị'."],
["Chủ nghĩa trọng thương cho rằng nguồn gốc của cải chủ yếu đến từ đâu?", ["Lưu thông, ngoại thương", "Sản xuất nông nghiệp", "Sản xuất công nghiệp", "Lao động nói chung"], 0, "Trọng thương (thế kỷ XV–XVII) coi lưu thông, đặc biệt là ngoại thương, là nguồn gốc của cải; của cải được đồng nhất với tiền (vàng, bạc)."],
["Chủ nghĩa trọng nông coi nguồn gốc của cải là:", ["Lĩnh vực sản xuất nông nghiệp", "Lĩnh vực lưu thông", "Ngoại thương", "Công nghiệp chế tạo"], 0, "Trọng nông (Pháp, giữa thế kỷ XVIII) chuyển nghiên cứu từ lưu thông sang sản xuất, nhưng chỉ coi nông nghiệp là ngành tạo ra 'sản phẩm thuần túy'."],
["Đại biểu tiêu biểu của chủ nghĩa trọng nông, tác giả \"Biểu kinh tế\", là:", ["François Quesnay", "William Petty", "David Ricardo", "Adam Smith"], 0, "F. Quesnay là đại biểu nổi bật nhất của trọng nông Pháp, nổi tiếng với 'Biểu kinh tế' (Tableau économique)."],

title: "Hàng hóa, thị trường và vai trò của các chủ thể tham gia thị trường",

notes: `
<h3>1. Sản xuất hàng hóa</h3>
<p>Kiểu tổ chức kinh tế mà sản phẩm làm ra để <b>trao đổi, mua bán</b>. Hai điều kiện ra đời:</p>
<ul>
<li><b>Phân công lao động xã hội</b>.</li>
<li><b>Sự tách biệt về mặt kinh tế</b> giữa các chủ thể sản xuất.</li>
<li>Thiếu một trong hai điều kiện thì không có sản xuất hàng hóa.</li>
</ul>
<h3>2. Hàng hóa</h3>
<p>Sản phẩm của lao động, thỏa mãn nhu cầu con người, thông qua trao đổi, mua bán. Có hữu hình và vô hình (dịch vụ).</p>
<table><tr><th>Giá trị sử dụng</th><th>Giá trị</th></tr>
<tr><td>Công dụng thỏa mãn nhu cầu</td><td>Lao động xã hội của người sản xuất kết tinh trong hàng hóa</td></tr>
<tr><td>Phạm trù vĩnh viễn</td><td>Phạm trù lịch sử</td></tr>
<tr><td>Do <b>lao động cụ thể</b> tạo ra</td><td>Do <b>lao động trừu tượng</b> tạo ra; biểu hiện qua <b>giá trị trao đổi</b></td></tr></table>
<p><b>Tính hai mặt của lao động</b> sản xuất hàng hóa do C. Mác phát hiện.</p>
<h3>3. Lượng giá trị</h3>
<ul>
<li>Đo bằng <b>thời gian lao động xã hội cần thiết</b> (điều kiện bình thường, trình độ thành thạo trung bình, cường độ trung bình).</li>
<li><b>Năng suất lao động</b> tăng → lượng giá trị một đơn vị hàng hóa <b>giảm</b> (tỷ lệ nghịch).</li>
<li><b>Cường độ lao động</b> tăng → tổng sản phẩm tăng, giá trị một đơn vị <b>không đổi</b>.</li>
<li>Lao động <b>phức tạp</b> tạo ra nhiều giá trị hơn lao động giản đơn trong cùng thời gian.</li>
<li>Cấu thành: <b>W = c + v + m</b>.</li>
</ul>
<h3>4. Tiền</h3>
<p>Bốn hình thái giá trị: giản đơn (ngẫu nhiên) → mở rộng (đầy đủ) → chung → <b>tiền</b>. Bản chất: hàng hóa đặc biệt làm <b>vật ngang giá chung</b>.</p>
<p>Năm chức năng: <b>thước đo giá trị</b> (không cần tiền mặt), <b>phương tiện lưu thông</b> (H–T–H), <b>phương tiện cất trữ</b> (cần tiền đủ giá trị), <b>phương tiện thanh toán</b> (trả nợ, nộp thuế, mua chịu), <b>tiền tệ thế giới</b>.</p>
<h3>5. Thị trường và các quy luật</h3>
<ul>
<li>Chức năng thị trường: thực hiện (thừa nhận) giá trị hàng hóa; thông tin; kích thích hoặc hạn chế sản xuất và tiêu dùng.</li>
<li><b>Quy luật giá trị</b>: sản xuất và trao đổi dựa trên hao phí lao động xã hội cần thiết. Tác động: điều tiết sản xuất và lưu thông; kích thích cải tiến kỹ thuật, tăng NSLĐ; phân hóa người sản xuất.</li>
<li><b>Quy luật cung – cầu</b>: cung &gt; cầu → giá &lt; giá trị; cung &lt; cầu → giá &gt; giá trị.</li>
<li><b>Quy luật lưu thông tiền tệ</b>: M = P·Q / V.</li>
<li><b>Quy luật cạnh tranh</b>: cạnh tranh trong nội bộ ngành và giữa các ngành (chi tiết ở chương 4). Tích cực: thúc đẩy tiến bộ KH–KT, phát triển LLSX. Tiêu cực: phân hóa người sản xuất, gây rối thị trường…</li>
<li>Khuyết tật KTTT: tiềm ẩn khủng hoảng; không tự khắc phục cạn kiệt tài nguyên, ô nhiễm; không tự khắc phục phân hóa xã hội.</li>
</ul>
<h3>6. Chủ thể tham gia thị trường</h3>
<p>Người sản xuất; người tiêu dùng; thương nhân và các trung gian thương mại; Nhà nước.</p>`,

notes: `
<h3>1. Nguồn gốc giá trị thặng dư</h3>
<ul>
<li>Công thức chung của tư bản: <b>T – H – T'</b> (T' = T + ΔT). Mục đích: giá trị lớn hơn (khác H – T – H mục đích là GTSD).</li>
<li>Mâu thuẫn công thức chung: GTTD <b>không sinh ra trong lưu thông</b> nhưng cũng <b>không thể ra ngoài lưu thông</b>. Chìa khóa: <b>hàng hóa sức lao động</b>.</li>
<li>Hai điều kiện để SLĐ thành hàng hóa: người lao động <b>tự do về thân thể</b>; <b>không có đủ tư liệu sản xuất</b>.</li>
<li>Giá trị SLĐ: đo gián tiếp bằng giá trị tư liệu sinh hoạt (cho bản thân, gia đình, đào tạo); bao hàm <b>yếu tố tinh thần và lịch sử</b>.</li>
<li>GTSD đặc biệt của SLĐ: tạo ra <b>giá trị mới lớn hơn</b> giá trị bản thân nó.</li>
</ul>
<h3>2. Tư bản bất biến, khả biến; cố định, lưu động</h3>
<ul>
<li><b>c</b> (bất biến): tư liệu sản xuất, giá trị chuyển nguyên vẹn. <b>v</b> (khả biến): mua SLĐ, tăng lên về lượng. Căn cứ: <b>vai trò trong tạo ra GTTD</b>.</li>
<li><b>Cố định / lưu động</b>: căn cứ <b>phương thức chuyển dịch giá trị</b>. Hao mòn hữu hình (do sử dụng, tự nhiên) và vô hình (do tiến bộ kỹ thuật).</li>
</ul>
<h3>3. Công thức</h3>
<ul>
<li>Tỷ suất GTTD: <b>m' = m/v × 100%</b> (trình độ bóc lột). Khối lượng: <b>M = m'·V</b> (quy mô).</li>
<li>Chi phí sản xuất: <b>k = c + v</b>. Lợi nhuận <b>p</b> là hình thái biểu hiện của m.</li>
<li>Tỷ suất lợi nhuận: <b>p' = m/(c + v) × 100%</b>.</li>
<li>Giá cả sản xuất = <b>k + p̄</b> (lợi nhuận bình quân).</li>
<li>Số vòng chu chuyển: <b>n = CH / ch</b> (CH = 12 tháng).</li>
<li>Giá cả ruộng đất = <b>địa tô / tỷ suất lợi tức ngân hàng</b>.</li>
</ul>
<h3>4. Phương pháp sản xuất GTTD</h3>
<ul>
<li><b>Tuyệt đối</b>: kéo dài ngày lao động (hoặc tăng cường độ), thời gian lao động tất yếu không đổi.</li>
<li><b>Tương đối</b>: rút ngắn thời gian lao động tất yếu nhờ tăng <b>NSLĐ xã hội</b>.</li>
<li><b>Siêu ngạch</b>: do NSLĐ <b>cá biệt</b> cao hơn xã hội; là hình thái biến tướng của GTTD tương đối.</li>
</ul>
<h3>5. Tuần hoàn, tích lũy</h3>
<ul>
<li>Tuần hoàn: tư bản <b>tiền tệ → sản xuất → hàng hóa</b>.</li>
<li>Tích lũy tư bản = <b>tư bản hóa GTTD</b>. Nhân tố: m', NSLĐ, chênh lệch tư bản sử dụng và tiêu dùng, quy mô tư bản ứng trước.</li>
<li><b>Tích tụ</b>: tăng quy mô nhờ tư bản hóa GTTD (tăng tư bản xã hội). <b>Tập trung</b>: hợp nhất các tư bản cá biệt (không tăng tư bản xã hội).</li>
<li>Cấu tạo hữu cơ <b>c/v</b>: cấu tạo giá trị do cấu tạo kỹ thuật quyết định.</li>
</ul>

notes: `
<h3>1. Cạnh tranh</h3>
<ul><li>Cạnh tranh <b>trong nội bộ ngành</b> → hình thành <b>giá trị thị trường</b>.</li><li>Cạnh tranh <b>giữa các ngành</b> → hình thành <b>tỷ suất lợi nhuận bình quân</b>.</li></ul>
<h3>2. Độc quyền và nguyên nhân hình thành</h3>
<ul>
<li><b>Độc quyền</b>: liên minh giữa các doanh nghiệp lớn, nắm phần lớn việc sản xuất và tiêu thụ một số loại hàng hóa, có khả năng định ra <b>giá cả độc quyền</b>, thu <b>lợi nhuận độc quyền cao</b>.</li>
<li>Nguyên nhân: sự phát triển của LLSX; cạnh tranh gay gắt; <b>khủng hoảng kinh tế 1873</b>; sự phát triển của hệ thống tín dụng. Kết quả trực tiếp của <b>tích tụ và tập trung sản xuất</b>.</li>
<li><b>Giá cả độc quyền</b>: cao khi bán, thấp khi mua. Quy luật giá trị biểu hiện thành quy luật giá cả độc quyền; quy luật GTTD biểu hiện thành quy luật lợi nhuận độc quyền cao.</li>
<li>Độc quyền <b>không thủ tiêu cạnh tranh</b> mà làm cạnh tranh đa dạng, gay gắt hơn: giữa độc quyền và ngoài độc quyền; giữa các độc quyền với nhau; trong nội bộ độc quyền.</li>
</ul>
<h3>3. Năm đặc điểm kinh tế cơ bản của CNTB độc quyền (Lênin)</h3>
<ol>
<li>Tập trung sản xuất và các tổ chức độc quyền.</li>
<li>Tư bản tài chính và hệ thống tài phiệt chi phối.</li>
<li>Xuất khẩu tư bản.</li>

<li>Sự phân chia thế giới về lãnh thổ giữa các cường quốc tư bản.</li>
</ol>
<h3>4. Hình thức tổ chức độc quyền</h3>
<table><tr><th>Hình thức</th><th>Đặc điểm</th></tr>

<tr><td>Syndicate</td><td>Độc lập sản xuất, mất độc lập lưu thông (ban quản trị chung mua bán)</td></tr>
<tr><td>Trust</td><td>Mất độc lập cả sản xuất lẫn lưu thông; thành cổ đông</td></tr>
<tr><td>Consortium</td><td>Liên kết dọc nhiều ngành, gồm cả syndicate, trust</td></tr></table>
<p>Ngày nay: concern, conglomerate (đa ngành).</p>

<li><b>Tư bản tài chính</b>: dung hợp tư bản ngân hàng độc quyền với tư bản công nghiệp độc quyền. Đầu sỏ tài chính chi phối qua <b>"chế độ tham dự"</b>.</li>
<li><b>Xuất khẩu tư bản</b>: đưa tư bản ra nước ngoài để sản xuất GTTD ở nước nhập khẩu. Hình thức: trực tiếp (FDI) và gián tiếp. CNTB tự do cạnh tranh chủ yếu <b>xuất khẩu hàng hóa</b>.</li>
</ul>
<h3>5. Độc quyền nhà nước</h3>

<li>Bản chất: nấc thang phát triển mới của CNTB độc quyền, không thay đổi bản chất CNTB.</li>

title: "Kinh tế thị trường định hướng XHCN và các quan hệ lợi ích kinh tế ở Việt Nam",
short: "KTTT định hướng XHCN & lợi ích",
notes: `
<h3>1. Khái niệm</h3>
<p><b>KTTT định hướng XHCN</b>: nền kinh tế vận hành theo các quy luật của thị trường, đồng thời góp phần hướng tới từng bước xác lập một xã hội <b>dân giàu, nước mạnh, dân chủ, công bằng, văn minh</b>; có sự điều tiết của Nhà nước do Đảng Cộng sản Việt Nam lãnh đạo.</p>
<ul>
<li>Đổi mới bắt đầu từ <b>Đại hội VI (1986)</b>. Khái niệm KTTT định hướng XHCN chính thức nêu tại <b>Đại hội IX (2001)</b>.</li>
<li>Tính tất yếu: phù hợp xu hướng phát triển khách quan; có tính ưu việt thúc đẩy phát triển; phù hợp nguyện vọng dân giàu, nước mạnh…</li>
</ul>
<h3>2. Đặc trưng</h3>
<ul>
<li><b>Mục tiêu</b>: phát triển LLSX, xây dựng CSVC–KT cho CNXH, dân giàu, nước mạnh, dân chủ, công bằng, văn minh.</li>
<li><b>Sở hữu và thành phần kinh tế</b>: nhiều hình thức sở hữu, nhiều thành phần kinh tế; <b>kinh tế nhà nước giữ vai trò chủ đạo</b>; <b>kinh tế tư nhân là một động lực quan trọng</b>; các thành phần bình đẳng trước pháp luật. Đất đai thuộc <b>sở hữu toàn dân</b> do Nhà nước đại diện chủ sở hữu.</li>
<li><b>Quản lý</b>: Đảng lãnh đạo, Nhà nước quản lý, nhân dân làm chủ.</li>
<li><b>Phân phối</b>: chủ yếu theo kết quả lao động, hiệu quả kinh tế; theo mức đóng góp vốn và nguồn lực khác; qua hệ thống an sinh xã hội, phúc lợi xã hội.</li>
<li><b>Tăng trưởng gắn với công bằng xã hội</b>: thực hiện tiến bộ và công bằng xã hội ngay trong từng chính sách, từng bước phát triển.</li>
</ul>
<h3>3. Hoàn thiện thể chế</h3>
<p><b>Thể chế kinh tế</b>: hệ thống quy tắc, luật pháp, bộ máy quản lý và cơ chế vận hành điều chỉnh hoạt động của các chủ thể kinh tế. Lý do hoàn thiện: thể chế chưa đồng bộ; kém hiệu lực, hiệu quả; chưa đầy đủ các yếu tố thị trường.</p>
<p>Nội dung: hoàn thiện thể chế về sở hữu và các thành phần kinh tế; phát triển đồng bộ các yếu tố thị trường và các loại thị trường; bảo đảm gắn tăng trưởng với tiến bộ, công bằng; thúc đẩy hội nhập; nâng cao năng lực lãnh đạo của Đảng, quản lý của Nhà nước, vai trò của MTTQ và các tổ chức chính trị – xã hội.</p>
<h3>4. Lợi ích kinh tế</h3>
<ul>
<li><b>Lợi ích kinh tế</b>: lợi ích vật chất, thu được khi thực hiện các hoạt động kinh tế. Bản chất: phản ánh mục đích và động cơ của quan hệ giữa các chủ thể.</li>

<ul>

<li><b>Chủ nghĩa trọng thương</b> (từ thế kỷ XV đến cuối thế kỷ XVII), gắn với thời kỳ tích lũy nguyên thủy của CNTB. Coi trọng vai trò của <b>thương mại</b>, nhất là ngoại thương; cho rằng của cải là tiền (vàng, bạc), lợi nhuận sinh ra từ lĩnh vực lưu thông. Đây là hệ thống lý luận KTCT bước đầu nghiên cứu về nền sản xuất TBCN.</li>
<li><b>Chủ nghĩa trọng nông</b> (Pháp, thế kỷ XVIII): chuyển đối tượng nghiên cứu từ lưu thông sang <b>sản xuất</b>, nhưng chỉ coi <b>nông nghiệp</b> là ngành sản xuất ra của cải; coi trọng sở hữu tư nhân và tự do kinh tế. Đại biểu: F. Quesnay (tác giả <i>Biểu kinh tế</i>), Turgot.</li>
<li><b>KTCT tư sản cổ điển Anh</b>: đại biểu tiêu biểu W. Petty, A. Smith (<i>Của cải của các dân tộc</i>, 1776), D. Ricardo. Lần đầu tiên nghiên cứu các phạm trù kinh tế một cách có hệ thống; đóng góp lớn nhất là xây dựng <b>lý thuyết giá trị – lao động</b> (lao động là nguồn gốc của giá trị).</li>
</ul>
<p>Chủ nghĩa Mác – Lênin gồm 3 bộ phận hợp thành: Triết học, Kinh tế chính trị và Chủ nghĩa xã hội khoa học. <b>KTCT Mác – Lênin</b> ra đời vào thế kỷ XIX, do C. Mác và Ph. Ăngghen sáng lập trên cơ sở kế thừa có phê phán những giá trị khoa học của KTCT cổ điển Anh. Lý luận được thể hiện tập trung và cô đọng nhất trong <b>Bộ Tư bản</b>. Hai phát hiện quan trọng của Mác: <b>tính hai mặt của lao động sản xuất hàng hóa</b> và <b>học thuyết giá trị thặng dư</b> (được coi là "hòn đá tảng"). Sau khi Mác và Ăngghen qua đời, <b>V.I. Lênin</b> tiếp tục kế thừa, bổ sung và phát triển, đặc biệt là lý luận về CNTB độc quyền và về thời kỳ quá độ lên CNXH.</p>

<h3>2. Đối tượng nghiên cứu</h3>
<p>Đối tượng nghiên cứu của KTCT Mác – Lênin là <b>các quan hệ xã hội của sản xuất và trao đổi</b> mà các quan hệ này được đặt trong sự liên hệ biện chứng với trình độ phát triển của <b>lực lượng sản xuất</b> và <b>kiến trúc thượng tầng</b> tương ứng của phương thức sản xuất nhất định.</p>
<ul>
<li>KTCT không nghiên cứu các yếu tố kỹ thuật của sản xuất một cách tách rời, mà nghiên cứu quan hệ giữa người với người trong sản xuất và trao đổi.</li>
<li><b>Mục đích</b> nghiên cứu ở cấp độ cao nhất: phát hiện ra các <b>quy luật kinh tế</b> chi phối các quan hệ giữa người với người trong sản xuất và trao đổi; từ đó vận dụng để thúc đẩy văn minh, phát triển của xã hội.</li>
</ul>
<table><tr><th>Quy luật kinh tế</th><th>Chính sách kinh tế</th></tr>
<tr><td>Mối liên hệ phản ánh bản chất, khách quan, lặp đi lặp lại của các hiện tượng, quá trình kinh tế</td><td>Sản phẩm chủ quan của nhà nước, hình thành trên cơ sở vận dụng các quy luật kinh tế</td></tr>
<tr><td>Tồn tại khách quan, con người không thể thủ tiêu, chỉ có thể nhận thức và vận dụng</td><td>Có thể phù hợp hoặc không phù hợp với quy luật</td></tr>
<tr><td>Chỉ phát huy tác dụng thông qua hoạt động kinh tế của con người</td><td>Phù hợp quy luật thì thúc đẩy kinh tế phát triển; trái quy luật thì kìm hãm</td></tr></table>

<h3>3. Phương pháp nghiên cứu</h3>
<ul>
<li><b>Phương pháp luận chung:</b> phép biện chứng duy vật (xem xét sự vật trong mối liên hệ phổ biến và trong sự vận động, phát triển).</li>
<li><b>Phương pháp đặc thù, quan trọng nhất:</b> <b>trừu tượng hóa khoa học</b>. Vì không thể làm thí nghiệm như khoa học tự nhiên, người nghiên cứu phải gạt bỏ những hiện tượng ngẫu nhiên, tạm thời, giữ lại những yếu tố bền vững, ổn định, điển hình để nắm bản chất và quy luật.</li>
<li>Các phương pháp khác: logic kết hợp với lịch sử, phân tích và tổng hợp, quy nạp và diễn dịch, thống kê, so sánh, mô hình hóa…</li>
</ul>

<h3>4. Chức năng của KTCT Mác – Lênin (4 chức năng)</h3>
<ol>
<li><b>Nhận thức:</b> cung cấp hệ thống tri thức lý luận về sự vận động của các quan hệ kinh tế và các quy luật kinh tế.</li>
<li><b>Thực tiễn:</b> giúp người học vận dụng quy luật vào thực tiễn, nâng cao năng lực giải quyết các vấn đề kinh tế; là cơ sở khoa học cho việc hoạch định chính sách.</li>
<li><b>Tư tưởng:</b> góp phần xây dựng thế giới quan khoa học, nền tảng tư tưởng cộng sản cho người lao động; củng cố niềm tin vào mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.</li>
<li><b>Phương pháp luận:</b> là nền tảng lý luận cho các khoa học kinh tế chuyên ngành và các khoa học khác có liên quan.</li>
</ol>
<p class="tip"><b>Mẹo nhớ:</b> 4 chức năng = "Nhận – Thực – Tư – Pháp" (nhận thức, thực tiễn, tư tưởng, phương pháp luận).</p>`,

2: `
<h3>1. Sản xuất hàng hóa</h3>
<p><b>Sản xuất hàng hóa</b> là kiểu tổ chức hoạt động kinh tế mà ở đó những người sản xuất ra sản phẩm nhằm mục đích <b>trao đổi, mua bán</b> (đối lập với sản xuất tự cấp tự túc).</p>
<p><b>Hai điều kiện ra đời:</b></p>
<ul>
<li><b>Phân công lao động xã hội:</b> sự chuyên môn hóa sản xuất, phân chia lao động xã hội vào các ngành, lĩnh vực khác nhau. Mỗi người chỉ sản xuất một hoặc vài thứ nhưng nhu cầu cần nhiều thứ, nên phải trao đổi.</li>
<li><b>Sự tách biệt về mặt kinh tế</b> giữa các chủ thể sản xuất: các chủ thể độc lập, có quyền sở hữu khác nhau đối với sản phẩm, nên muốn dùng sản phẩm của nhau phải trao đổi, mua bán.</li>
</ul>
<p>Thiếu một trong hai điều kiện thì không có sản xuất hàng hóa.</p>

<h3>2. Hàng hóa và hai thuộc tính</h3>
<p><b>Hàng hóa</b> là sản phẩm của lao động, có thể thỏa mãn nhu cầu nào đó của con người thông qua trao đổi, mua bán. Hàng hóa có thể ở dạng hữu hình (vật thể) hoặc vô hình (dịch vụ).</p>
<table><tr><th></th><th>Giá trị sử dụng</th><th>Giá trị</th></tr>
<tr><td>Khái niệm</td><td>Công dụng của vật phẩm, thỏa mãn nhu cầu (tiêu dùng cá nhân hoặc sản xuất)</td><td>Lao động xã hội của người sản xuất hàng hóa kết tinh trong hàng hóa</td></tr>
<tr><td>Tính chất</td><td>Phạm trù vĩnh viễn; do thuộc tính tự nhiên của vật quyết định</td><td>Phạm trù lịch sử; chỉ tồn tại trong kinh tế hàng hóa</td></tr>
<tr><td>Do lao động nào tạo ra</td><td>Lao động cụ thể</td><td>Lao động trừu tượng</td></tr>
<tr><td>Biểu hiện</td><td>Được thực hiện trong tiêu dùng</td><td>Biểu hiện ra bên ngoài qua <b>giá trị trao đổi</b></td></tr></table>
<p>Giá trị trao đổi là quan hệ về lượng, tỷ lệ trao đổi giữa các giá trị sử dụng khác nhau. Giá trị là nội dung, là cơ sở của giá trị trao đổi.</p>

<h3>3. Tính hai mặt của lao động sản xuất hàng hóa</h3>
<ul>
<li><b>Lao động cụ thể:</b> lao động có ích dưới một hình thức cụ thể của một nghề nghiệp chuyên môn nhất định; mỗi lao động cụ thể có mục đích, đối tượng, công cụ, phương pháp và kết quả riêng; tạo ra <b>giá trị sử dụng</b>.</li>
<li><b>Lao động trừu tượng:</b> lao động của người sản xuất hàng hóa khi đã gạt bỏ những hình thức cụ thể, là sự hao phí sức lao động nói chung (cơ bắp, thần kinh, trí óc); tạo ra <b>giá trị</b>.</li>
<li>Lao động cụ thể phản ánh tính chất <b>tư nhân</b>, lao động trừu tượng phản ánh tính chất <b>xã hội</b> của lao động sản xuất hàng hóa. Mâu thuẫn giữa lao động tư nhân và lao động xã hội là mâu thuẫn cơ bản của sản xuất hàng hóa.</li>
</ul>

<h3>4. Lượng giá trị và các nhân tố ảnh hưởng</h3>
<ul>
<li>Lượng giá trị được đo bằng <b>thời gian lao động xã hội cần thiết</b>: thời gian đòi hỏi để sản xuất ra một giá trị sử dụng trong điều kiện bình thường của xã hội, với trình độ thành thạo trung bình, cường độ lao động trung bình.</li>
<li><b>Năng suất lao động</b> (số sản phẩm/đơn vị thời gian): tăng NSLĐ → lượng giá trị của một đơn vị hàng hóa <b>giảm</b>. Lượng giá trị tỷ lệ nghịch với NSLĐ.</li>
<li><b>Cường độ lao động</b> (mức khẩn trương, nặng nhọc): tăng cường độ → tổng số sản phẩm và tổng giá trị tăng, nhưng giá trị một đơn vị hàng hóa <b>không đổi</b>.</li>
<li><b>Tính chất phức tạp của lao động:</b> lao động phức tạp (phải qua đào tạo) trong cùng thời gian tạo ra nhiều giá trị hơn lao động giản đơn.</li>
<li>Cấu thành lượng giá trị: <b>W = c + v + m</b> (c: giá trị cũ của tư liệu sản xuất chuyển vào; v + m: giá trị mới do lao động sống tạo ra).</li>
</ul>

<h3>5. Tiền</h3>
<p><b>Nguồn gốc:</b> tiền là kết quả của quá trình phát triển lâu dài của sản xuất và trao đổi, qua 4 hình thái giá trị:</p>
<ol>
<li>Hình thái giá trị giản đơn hay ngẫu nhiên (1 hàng hóa A = 1 hàng hóa B).</li>
<li>Hình thái giá trị đầy đủ hay mở rộng (1 hàng hóa = nhiều hàng hóa khác).</li>
<li>Hình thái chung của giá trị (nhiều hàng hóa = 1 hàng hóa làm vật ngang giá chung, nhưng chưa cố định).</li>
<li>Hình thái tiền (vật ngang giá chung cố định ở vàng, bạc).</li>
</ol>
<p><b>Bản chất:</b> tiền là một loại hàng hóa đặc biệt, là kết quả của quá trình phát triển sản xuất và trao đổi, đóng vai trò là <b>vật ngang giá chung</b>.</p>
<p><b>Năm chức năng:</b></p>
<ul>
<li><b>Thước đo giá trị:</b> dùng tiền để biểu hiện và đo lường giá trị của hàng hóa (giá cả). Chỉ cần tiền trong ý niệm.</li>
<li><b>Phương tiện lưu thông:</b> tiền làm môi giới trao đổi theo công thức H – T – H.</li>
<li><b>Phương tiện cất trữ:</b> tiền rút khỏi lưu thông, được cất trữ; đòi hỏi tiền đủ giá trị (vàng, bạc).</li>
<li><b>Phương tiện thanh toán:</b> trả nợ, nộp thuế, trả tiền mua chịu…</li>
<li><b>Tiền tệ thế giới:</b> tiền dùng trong trao đổi, thanh toán giữa các quốc gia.</li>
</ul>
<p><b>Dịch vụ</b> là hàng hóa vô hình: không thể cất trữ, việc sản xuất và tiêu dùng thường diễn ra đồng thời.</p>

<h3>6. Thị trường và nền kinh tế thị trường</h3>
<ul>
<li><b>Thị trường</b> (nghĩa hẹp): nơi diễn ra hành vi trao đổi, mua bán hàng hóa. (Nghĩa rộng): tổng hòa các mối quan hệ liên quan đến trao đổi, mua bán hàng hóa trong xã hội.</li>
<li><b>Vai trò</b> <span class="unv">Chưa đối chiếu nguyên văn giáo trình</span>: điều kiện, môi trường cho sản xuất phát triển; kích thích sáng tạo, phân bổ nguồn lực hiệu quả; gắn kết nền kinh tế thành một chỉnh thể, gắn kinh tế quốc gia với kinh tế thế giới.</li>
<li><b>Chức năng:</b> thực hiện (thừa nhận) giá trị sử dụng và giá trị của hàng hóa; cung cấp thông tin; kích thích hoặc hạn chế sản xuất và tiêu dùng.</li>
<li><b>Ưu thế của KTTT</b> <span class="unv">Chưa đối chiếu nguyên văn giáo trình</span>: tạo động lực cho sự hình thành ý tưởng mới; phát huy tốt nhất tiềm năng của mọi chủ thể, vùng miền; tạo phương thức thỏa mãn tối đa nhu cầu con người.</li>
<li><b>Khuyết tật của KTTT:</b> luôn tiềm ẩn rủi ro khủng hoảng; không tự khắc phục được xu hướng cạn kiệt tài nguyên, suy thoái môi trường; không tự khắc phục được hiện tượng phân hóa sâu sắc trong xã hội.</li>
</ul>

<h3>7. Các quy luật kinh tế chủ yếu của thị trường</h3>
<ul>
<li><b>Quy luật giá trị</b> – quy luật kinh tế cơ bản của sản xuất hàng hóa. Yêu cầu: sản xuất và trao đổi phải dựa trên cơ sở hao phí lao động xã hội cần thiết; trao đổi theo nguyên tắc ngang giá. Giá cả dao động xung quanh giá trị. Ba tác động:
<ol><li>Tự phát điều tiết sản xuất và lưu thông hàng hóa.</li><li>Tự phát kích thích cải tiến kỹ thuật, hợp lý hóa sản xuất, tăng NSLĐ, thúc đẩy LLSX phát triển.</li><li>Bình tuyển tự nhiên và phân hóa người sản xuất thành người giàu, người nghèo.</li></ol></li>
<li><b>Quy luật cung – cầu:</b> cung &gt; cầu → giá cả &lt; giá trị; cung &lt; cầu → giá cả &gt; giá trị; cung = cầu → giá cả = giá trị.</li>
<li><b>Quy luật lưu thông tiền tệ:</b> M = P·Q / V (M: lượng tiền cần cho lưu thông; P: mức giá; Q: khối lượng hàng hóa; V: số vòng lưu thông của tiền).</li>
<li><b>Quy luật cạnh tranh:</b> cạnh tranh trong nội bộ ngành và giữa các ngành (chi tiết ở chương 4). Tích cực: thúc đẩy tiến bộ KH–KT, phát triển LLSX, phân bổ nguồn lực hiệu quả. Tiêu cực: phân hóa người sản xuất, gây rối thị trường, lãng phí nguồn lực, tổn hại phúc lợi xã hội.</li>
</ul>

<h3>8. Vai trò của các chủ thể tham gia thị trường</h3>
<ul>
<li><b>Người sản xuất:</b> sản xuất, cung cấp hàng hóa, dịch vụ; phải có trách nhiệm với con người, xã hội.</li>
<li><b>Người tiêu dùng:</b> mua hàng hóa, dịch vụ; định hướng sản xuất; cần tiêu dùng có trách nhiệm.</li>
<li><b>Thương nhân và các trung gian thương mại:</b> cầu nối giữa sản xuất và tiêu dùng, giữa các chủ thể; làm thị trường linh hoạt hơn.</li>
<li><b>Nhà nước:</b> quản lý nhà nước về kinh tế, tạo lập môi trường thuận lợi; khắc phục khuyết tật của thị trường.</li>
</ul>`,

3: `
<h3>1. Nguồn gốc của giá trị thặng dư</h3>
<p><b>Công thức chung của tư bản: T – H – T'</b> (T' = T + ΔT; ΔT là giá trị thặng dư). So với lưu thông hàng hóa giản đơn H – T – H (mục đích là giá trị sử dụng), lưu thông tư bản nhằm mục đích <b>giá trị lớn hơn</b>.</p>
<p>Mục đích trực tiếp của sản xuất TBCN là tạo ra ngày càng nhiều GTTD; <b>sản xuất giá trị thặng dư là quy luật kinh tế tuyệt đối của CNTB</b>. Tiền chỉ chuyển hóa thành tư bản khi sức lao động trở thành hàng hóa.</p>
<p><b>Mâu thuẫn của công thức chung:</b> giá trị thặng dư không sinh ra trong lưu thông (trao đổi ngang giá hay không ngang giá đều không làm tăng tổng giá trị xã hội), nhưng cũng không thể sinh ra ở ngoài lưu thông. Chìa khóa giải quyết: <b>hàng hóa sức lao động</b>.</p>
<p><b>Sức lao động</b> là toàn bộ những năng lực thể chất và tinh thần tồn tại trong cơ thể con người, được vận dụng khi sản xuất ra giá trị sử dụng.</p>
<ul>
<li><b>Hai điều kiện</b> để SLĐ trở thành hàng hóa: người lao động <b>tự do về thân thể</b>; người lao động <b>không có đủ tư liệu sản xuất</b> cần thiết để tự kết hợp với SLĐ của mình.</li>
<li><b>Giá trị</b> của hàng hóa SLĐ: đo gián tiếp bằng giá trị các tư liệu sinh hoạt cần thiết để tái sản xuất SLĐ, gồm: tư liệu sinh hoạt cho bản thân người lao động; phí tổn đào tạo; tư liệu sinh hoạt nuôi con. Giá trị SLĐ bao hàm cả <b>yếu tố tinh thần và lịch sử</b>.</li>
<li><b>Giá trị sử dụng đặc biệt:</b> khi được sử dụng, SLĐ tạo ra một lượng giá trị mới <b>lớn hơn</b> giá trị của bản thân nó. Đây là nguồn gốc của giá trị thặng dư.</li>
</ul>

<h3>2. Sự sản xuất giá trị thặng dư</h3>
<p>Quá trình sản xuất TBCN là sự thống nhất giữa quá trình sản xuất ra giá trị sử dụng và quá trình làm tăng giá trị. Ngày lao động gồm 2 phần: <b>thời gian lao động tất yếu</b> (tạo ra lượng giá trị ngang với giá trị SLĐ, tức v) và <b>thời gian lao động thặng dư</b> (tạo ra m).</p>
<p><b>Giá trị thặng dư</b> là bộ phận giá trị mới dôi ra ngoài giá trị sức lao động do công nhân tạo ra, là kết quả của lao động không công của công nhân cho nhà tư bản.</p>
<table><tr><th>Cách chia</th><th>Bộ phận</th><th>Đặc điểm</th></tr>
<tr><td rowspan="2">Theo vai trò trong việc tạo ra GTTD</td><td>Tư bản bất biến (c)</td><td>Tồn tại dưới hình thái tư liệu sản xuất; giá trị được chuyển nguyên vẹn vào sản phẩm, không thay đổi về lượng</td></tr>
<tr><td>Tư bản khả biến (v)</td><td>Tồn tại dưới hình thái lao động sống (mua SLĐ); tăng lên về lượng trong sản xuất</td></tr>
<tr><td rowspan="2">Theo phương thức chuyển dịch giá trị</td><td>Tư bản cố định</td><td>Máy móc, nhà xưởng…: tham gia toàn bộ vào sản xuất nhưng giá trị chuyển dần từng phần vào sản phẩm</td></tr>
<tr><td>Tư bản lưu động</td><td>Nguyên, nhiên vật liệu, sức lao động: giá trị chuyển toàn bộ vào sản phẩm sau một chu kỳ</td></tr></table>
<p>Tư bản cố định bị <b>hao mòn hữu hình</b> (do sử dụng và tác động tự nhiên) và <b>hao mòn vô hình</b> (do tiến bộ kỹ thuật làm máy cùng loại rẻ hơn hoặc xuất hiện máy hiện đại hơn).</p>
<p><b>Tiền công</b> là giá cả của hàng hóa sức lao động (bề ngoài dễ bị hiểu nhầm là giá cả của lao động). Tiền công danh nghĩa là số tiền nhận được; tiền công thực tế là lượng hàng hóa, dịch vụ mua được bằng tiền công danh nghĩa.</p>
<p><b>Tuần hoàn tư bản:</b> sự vận động của tư bản lần lượt trải qua ba giai đoạn dưới ba hình thái (tư bản tiền tệ → tư bản sản xuất → tư bản hàng hóa) rồi quay về hình thái ban đầu kèm theo GTTD. <b>Chu chuyển tư bản</b> là tuần hoàn tư bản được xét là quá trình định kỳ, thường xuyên lặp lại. Số vòng chu chuyển: <b>n = CH / ch</b> (CH: thời gian của năm = 12 tháng; ch: thời gian một vòng chu chuyển).</p>

<h3>4. Hai phương pháp sản xuất giá trị thặng dư</h3>
<ul>
<li><b>GTTD tuyệt đối:</b> thu được do <b>kéo dài ngày lao động</b> vượt quá thời gian lao động tất yếu, trong khi NSLĐ, giá trị SLĐ và thời gian lao động tất yếu không đổi. (Tăng cường độ lao động cũng có tác dụng tương tự.) Giới hạn: thể chất, tinh thần người lao động và sự đấu tranh của công nhân.</li>
<li><b>GTTD tương đối:</b> thu được nhờ <b>rút ngắn thời gian lao động tất yếu</b> bằng cách hạ thấp giá trị SLĐ, nhờ tăng <b>NSLĐ xã hội</b> (trước hết ở các ngành sản xuất tư liệu sinh hoạt), trong khi độ dài ngày lao động không đổi.</li>
<li><b>GTTD siêu ngạch:</b> phần GTTD thu được do áp dụng công nghệ mới sớm hơn, làm <b>NSLĐ cá biệt</b> cao hơn NSLĐ xã hội. Là hình thái biến tướng của GTTD tương đối; mang tính tạm thời với từng nhà tư bản nhưng phổ biến trong toàn xã hội.</li>
</ul>

<h3>5. Tích lũy tư bản</h3>
<ul>
<li><b>Tái sản xuất mở rộng</b> TBCN: quá trình sản xuất lặp lại với quy mô lớn hơn. <b>Tích lũy tư bản</b> là tư bản hóa giá trị thặng dư. Nguồn gốc duy nhất của tích lũy là GTTD.</li>
<li>Nhân tố ảnh hưởng đến quy mô tích lũy: trình độ khai thác sức lao động (m'); năng suất lao động xã hội; sự chênh lệch giữa tư bản sử dụng và tư bản tiêu dùng; quy mô tư bản ứng trước.</li>
<li><b>Tích tụ tư bản:</b> tăng quy mô tư bản cá biệt bằng tư bản hóa GTTD → làm tăng quy mô tư bản xã hội.</li>
<li><b>Tập trung tư bản:</b> tăng quy mô tư bản cá biệt bằng cách hợp nhất các tư bản cá biệt sẵn có (tự nguyện hoặc thôn tính) → không làm tăng quy mô tư bản xã hội.</li>
<li><b>Cấu tạo hữu cơ (c/v):</b> cấu tạo giá trị do cấu tạo kỹ thuật quyết định và phản ánh những biến đổi của cấu tạo kỹ thuật. Tích lũy làm cấu tạo hữu cơ có xu hướng tăng.</li>
</ul>

<h3>6. Các hình thức biểu hiện của giá trị thặng dư</h3>
<ul>
<li><b>Lợi nhuận (p):</b> khi GTTD được quan niệm là con đẻ của toàn bộ tư bản ứng trước, nó mang hình thái chuyển hóa là lợi nhuận. Lợi nhuận che giấu nguồn gốc thực sự là lao động không công của công nhân.</li>
<li><b>Lợi nhuận bình quân:</b> do cạnh tranh giữa các ngành, tư bản di chuyển, tỷ suất lợi nhuận bình quân hóa; các tư bản bằng nhau đầu tư vào các ngành khác nhau thu lợi nhuận bằng nhau. Khi đó giá trị chuyển hóa thành <b>giá cả sản xuất</b>.</li>
<li><b>Lợi nhuận thương nghiệp:</b> một phần GTTD được tạo ra trong sản xuất mà tư bản công nghiệp nhượng lại cho tư bản thương nghiệp (vì thương nhân đảm nhận khâu bán hàng).</li>
<li><b>Lợi tức (z):</b> một phần của lợi nhuận bình quân mà người đi vay phải trả cho người cho vay vì đã sử dụng lượng tiền nhàn rỗi của người cho vay.</li>
<li><b>Địa tô TBCN:</b> phần GTTD còn lại sau khi khấu trừ lợi nhuận bình quân của nhà tư bản kinh doanh nông nghiệp, mà nhà tư bản phải trả cho địa chủ.
<ul><li><b>Địa tô chênh lệch I:</b> thu trên ruộng đất có độ màu mỡ tự nhiên trung bình và tốt, vị trí gần thị trường.</li>
<li><b>Địa tô chênh lệch II:</b> thu nhờ <b>thâm canh</b>, đầu tư thêm tư bản trên cùng đơn vị diện tích.</li>
<li><b>Địa tô tuyệt đối:</b> thu trên mọi loại ruộng đất cho thuê, kể cả ruộng xấu nhất; nguồn gốc từ độc quyền tư hữu ruộng đất.</li></ul></li>
</ul>`,

<h3>1. Cạnh tranh ở cấp độ độc quyền trong nền KTTT</h3>
<p><b>Cạnh tranh</b> là sự ganh đua giữa các chủ thể kinh tế nhằm có được những ưu thế về sản xuất cũng như tiêu thụ để thu lợi ích tối đa.</p>
<ul>
<li><b>Cạnh tranh trong nội bộ ngành:</b> giữa các doanh nghiệp trong cùng một ngành, sản xuất cùng loại hàng hóa. Biện pháp: cải tiến kỹ thuật, hạ giá trị cá biệt. Kết quả: hình thành <b>giá trị thị trường</b> của từng loại hàng hóa.</li>
<li><b>Cạnh tranh giữa các ngành:</b> giữa các doanh nghiệp ở các ngành khác nhau nhằm tìm nơi đầu tư có lợi hơn. Biện pháp: tự do di chuyển tư bản. Kết quả: hình thành <b>tỷ suất lợi nhuận bình quân</b>.</li>
</ul>

<h3>2. Độc quyền: nguyên nhân hình thành</h3>
<p><b>Độc quyền</b> là sự liên minh giữa các doanh nghiệp lớn, có khả năng thâu tóm việc sản xuất và tiêu thụ một số loại hàng hóa, có khả năng định ra <b>giá cả độc quyền</b>, nhằm thu <b>lợi nhuận độc quyền cao</b>.</p>
<p>Nguyên nhân hình thành (cuối thế kỷ XIX – đầu thế kỷ XX):</p>
<ul>
<li>Sự phát triển của lực lượng sản xuất và tiến bộ KH–KT đòi hỏi doanh nghiệp quy mô lớn; tích tụ, tập trung sản xuất ở mức cao.</li>
<li>Cạnh tranh gay gắt làm doanh nghiệp nhỏ phá sản, doanh nghiệp lớn liên kết với nhau.</li>
<li><b>Cuộc khủng hoảng kinh tế năm 1873</b> trong toàn bộ thế giới TBCN làm phá sản hàng loạt doanh nghiệp vừa và nhỏ, thúc đẩy tập trung tư bản.</li>
<li>Sự phát triển của hệ thống tín dụng trở thành đòn bẩy thúc đẩy tập trung sản xuất.</li>
</ul>
<ul>
<li><b>Giá cả độc quyền:</b> giá do các tổ chức độc quyền áp đặt trong mua và bán: <b>cao khi bán, thấp khi mua</b>. Giá cả độc quyền = chi phí sản xuất + lợi nhuận độc quyền.</li>
<li><b>Lợi nhuận độc quyền:</b> lợi nhuận cao hơn lợi nhuận bình quân, do sự thống trị của các tổ chức độc quyền đem lại.</li>
<li>Trong CNTB độc quyền: quy luật giá trị biểu hiện thành <b>quy luật giá cả độc quyền</b>; quy luật GTTD biểu hiện thành <b>quy luật lợi nhuận độc quyền cao</b>.</li>
</ul>

<h3>3. Quan hệ giữa độc quyền và cạnh tranh</h3>
<p>Độc quyền sinh ra từ cạnh tranh tự do nhưng <b>không thủ tiêu cạnh tranh</b>, mà làm cho cạnh tranh trở nên đa dạng, gay gắt hơn. Ba loại cạnh tranh mới:</p>
<ol>
<li>Cạnh tranh giữa các tổ chức độc quyền với các doanh nghiệp ngoài độc quyền (độc quyền tìm cách chèn ép, thôn tính).</li>
<li>Cạnh tranh giữa các tổ chức độc quyền với nhau (trong một ngành hoặc khác ngành).</li>
<li>Cạnh tranh trong nội bộ các tổ chức độc quyền (tranh giành địa vị chi phối, tỷ lệ phân chia lợi nhuận).</li>
</ol>

<h3>5. Năm đặc điểm kinh tế cơ bản của CNTB độc quyền (Lênin)</h3>
<ol>
<li><b>Tập trung sản xuất và các tổ chức độc quyền.</b> Các hình thức tổ chức độc quyền:
<table><tr><th>Hình thức</th><th>Đặc điểm</th></tr>
<tr><td>Cartel (Cácten)</td><td>Các nhà tư bản ký hiệp nghị thỏa thuận về giá cả, sản lượng, thị trường; vẫn độc lập cả sản xuất và lưu thông. Lỏng lẻo nhất, dễ tan vỡ</td></tr>
<tr><td>Syndicate (Xanhđica)</td><td>Cao hơn, ổn định hơn cartel: độc lập về sản xuất nhưng mất độc lập về lưu thông (ban quản trị chung lo mua bán)</td></tr>
<tr><td>Trust (Tờrớt)</td><td>Cao hơn cartel và syndicate: mất độc lập cả sản xuất lẫn lưu thông; các thành viên trở thành cổ đông</td></tr>
<tr><td>Consortium (Côngxoócxiom)</td><td>Trình độ và quy mô lớn hơn: liên kết dọc nhiều ngành, gồm cả syndicate, trust</td></tr></table>
Ngày nay phổ biến: <b>Concern</b> (tổ chức độc quyền đa ngành, gồm hàng trăm xí nghiệp) và <b>Conglomerate</b> (kết hợp vài ba chục hãng vừa và nhỏ không có liên quan gì với nhau về sản xuất).</li>
<li><b>Tư bản tài chính và hệ thống tài phiệt chi phối.</b> Tư bản tài chính là sự hợp nhất giữa tư bản độc quyền ngân hàng và tư bản độc quyền công nghiệp. Tầng lớp đầu sỏ (trùm) tài chính chi phối nền kinh tế thông qua <b>"chế độ tham dự"</b> (nắm cổ phiếu khống chế công ty mẹ → công ty con → công ty cháu…).</li>
<li><b>Xuất khẩu tư bản:</b> xuất khẩu giá trị ra nước ngoài (đầu tư tư bản ra nước ngoài) nhằm thu GTTD và các nguồn lợi khác ở nước nhập khẩu tư bản. Hình thức: <b>đầu tư trực tiếp</b> (FDI – trực tiếp kinh doanh, quản lý) và <b>đầu tư gián tiếp</b> (cho vay, mua cổ phiếu, trái phiếu…). CNTB tự do cạnh tranh chủ yếu xuất khẩu hàng hóa; CNTB độc quyền xuất khẩu tư bản.</li>
<li><b>Sự phân chia thế giới về kinh tế</b> giữa các tập đoàn tư bản độc quyền → hình thành các liên minh độc quyền quốc tế.</li>
<li><b>Sự phân chia thế giới về lãnh thổ</b> giữa các cường quốc tư bản → tranh giành thuộc địa, dẫn tới chiến tranh.</li>
</ol>

<h3>6. Độc quyền nhà nước trong CNTB</h3>
<p><b>Khái niệm:</b> sự kết hợp sức mạnh của các tổ chức độc quyền tư nhân với sức mạnh của nhà nước tư sản thành một thiết chế và thể chế thống nhất, nhằm phục vụ lợi ích của các tổ chức độc quyền và cứu nguy cho CNTB.</p>
<p><b>Nguyên nhân hình thành:</b></p>
<ul>
<li>Tích tụ và tập trung tư bản càng lớn thì tích tụ, tập trung sản xuất càng cao, đòi hỏi sự điều tiết của nhà nước.</li>
<li>Phân công lao động xã hội phát triển làm xuất hiện những ngành mà tư nhân không thể hoặc không muốn kinh doanh (vốn lớn, thu hồi chậm, ít lợi nhuận).</li>
<li>Sự thống trị của độc quyền làm sâu sắc mâu thuẫn giai cấp, đòi hỏi nhà nước can thiệp, xoa dịu.</li>
<li>Xu hướng quốc tế hóa đời sống kinh tế, sự bành trướng ra nước ngoài cần sự hỗ trợ của nhà nước.</li>
</ul>
<p><b>Ba biểu hiện chủ yếu:</b></p>
<ol>
<li><b>Sự kết hợp về nhân sự</b> giữa tổ chức độc quyền và nhà nước.</li>
<li><b>Sự hình thành, phát triển sở hữu nhà nước</b> (xây dựng DNNN bằng ngân sách, quốc hữu hóa, mua cổ phần…) và thị trường nhà nước.</li>
<li><b>Độc quyền nhà nước trở thành công cụ để nhà nước điều tiết nền kinh tế</b>.</li>
</ol>
<p><b>Bản chất:</b> CNTB độc quyền nhà nước là nấc thang phát triển mới của CNTB độc quyền, không làm thay đổi bản chất của CNTB.</p>

<h3>7. Vai trò lịch sử của chủ nghĩa tư bản</h3>
<ul>
<li><b>Tích cực:</b> giải phóng loài người khỏi "đêm trường trung cổ"; chuyển nền sản xuất nhỏ thành sản xuất lớn hiện đại; phát triển mạnh LLSX; thực hiện xã hội hóa sản xuất.</li>
<li><b>Giới hạn:</b> mục đích của nền sản xuất TBCN là lợi nhuận của thiểu số; gây ra chiến tranh, phân hóa giàu nghèo, khủng hoảng.</li>
</ul>`,

<h3>5. Lợi ích kinh tế</h3>
<ul>
<li><b>Lợi ích kinh tế</b> là lợi ích vật chất, lợi ích thu được khi thực hiện các hoạt động kinh tế của con người.</li>
<li><b>Bản chất:</b> phản ánh mục đích và động cơ của các quan hệ giữa các chủ thể trong nền sản xuất xã hội.</li>
<li><b>Biểu hiện:</b> người lao động → tiền công, tiền lương; chủ doanh nghiệp → lợi nhuận; chủ sở hữu đất → địa tô; người cho vay → lợi tức…</li>
<li><b>Vai trò:</b> là <b>động lực trực tiếp</b> của các chủ thể và hoạt động kinh tế – xã hội; là cơ sở thúc đẩy sự phát triển các lợi ích khác (chính trị, xã hội, văn hóa).</li>
</ul>

<h3>6. Quan hệ lợi ích kinh tế</h3>
<p><b>Quan hệ lợi ích kinh tế</b> là sự thiết lập những tương tác giữa con người với con người, giữa các cộng đồng người, giữa các tổ chức kinh tế, giữa các bộ phận hợp thành nền kinh tế, giữa con người với tổ chức kinh tế, giữa quốc gia với phần còn lại của thế giới nhằm mục tiêu xác lập các lợi ích kinh tế, trong mối liên hệ với trình độ phát triển của LLSX và kiến trúc thượng tầng tương ứng.</p>
<ul>
<li><b>Thống nhất:</b> một chủ thể có thể trở thành bộ phận cấu thành của chủ thể khác; lợi ích của chủ thể này được thực hiện thì lợi ích của chủ thể kia cũng trực tiếp hoặc gián tiếp được thực hiện.</li>
<li><b>Mâu thuẫn:</b> các chủ thể hành động theo những phương thức khác nhau để thực hiện lợi ích của mình, có thể làm tổn hại lợi ích của chủ thể khác.</li>
</ul>
<p><b>Bốn nhân tố ảnh hưởng:</b> trình độ phát triển của lực lượng sản xuất; địa vị của chủ thể trong hệ thống quan hệ sản xuất xã hội; chính sách phân phối thu nhập của Nhà nước; hội nhập kinh tế quốc tế.</p>
<p><b>Một số quan hệ lợi ích kinh tế cơ bản:</b></p>
<ul>
<li>Giữa người lao động và người sử dụng lao động (vừa thống nhất vừa mâu thuẫn: cùng cần doanh nghiệp phát triển, nhưng mâu thuẫn trong phân chia tiền công – lợi nhuận).</li>
<li>Giữa những người sử dụng lao động với nhau.</li>
<li>Giữa những người lao động với nhau.</li>
<li>Giữa lợi ích cá nhân, lợi ích nhóm và lợi ích xã hội.</li>
</ul>
<p><b>Phương thức thực hiện:</b> theo nguyên tắc thị trường; theo chính sách của Nhà nước và vai trò của các tổ chức xã hội.</p>

<h3>7. Vai trò của Nhà nước trong bảo đảm hài hòa các quan hệ lợi ích</h3>
<ol>
<li><b>Bảo vệ lợi ích hợp pháp, tạo môi trường thuận lợi</b> cho các hoạt động tìm kiếm lợi ích (giữ ổn định chính trị, xây dựng hạ tầng, hoàn thiện pháp luật…). Môi trường vĩ mô thuận lợi không tự hình thành mà phải do Nhà nước tạo lập.</li>
<li><b>Điều hòa lợi ích giữa cá nhân – doanh nghiệp – xã hội</b>, trước hết bằng chính sách phân phối thu nhập.</li>
<li><b>Kiểm soát, ngăn ngừa các quan hệ lợi ích có ảnh hưởng tiêu cực</b> (tham nhũng, buôn lậu, làm hàng giả, kinh doanh hàng cấm…).</li>
<li><b>Giải quyết những mâu thuẫn</b> trong quan hệ lợi ích kinh tế.</li>
</ol>`,

<h3>3. Công nghiệp hóa, hiện đại hóa ở Việt Nam</h3>
<p><b>Khái niệm</b> (Hội nghị Trung ương 7 khóa VII, 1994): CNH, HĐH là quá trình chuyển đổi căn bản, toàn diện các hoạt động sản xuất kinh doanh, dịch vụ và quản lý kinh tế – xã hội từ sử dụng sức lao động thủ công là chính sang sử dụng một cách phổ biến sức lao động cùng với công nghệ, phương tiện, phương pháp tiên tiến, hiện đại, dựa trên sự phát triển của công nghiệp và tiến bộ khoa học – công nghệ, nhằm tạo ra năng suất lao động xã hội cao.</p>
<p><b>Công nghiệp hóa</b> (khái niệm chung): quá trình chuyển đổi nền sản xuất xã hội từ dựa trên lao động thủ công là chính sang dựa chủ yếu trên lao động bằng máy móc, nhằm tạo ra năng suất lao động xã hội cao.</p>
<p>Nhận thức về công nghiệp hóa ở Việt Nam trải qua nhiều mốc, bắt đầu từ <b>Đại hội III (1960)</b>; công nghiệp hóa được xác định là <b>nhiệm vụ trung tâm</b> trong suốt thời kỳ quá độ. CNH, HĐH ở Việt Nam có <b>4 đặc điểm</b>:</p>
<ul>
<li>Theo định hướng XHCN, thực hiện mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.</li>
<li>Gắn với phát triển <b>kinh tế tri thức</b> (nền kinh tế trong đó tri thức đóng vai trò hàng đầu tạo ra tăng trưởng).</li>
<li>Trong điều kiện cơ chế thị trường có sự điều tiết của Nhà nước (KTTT định hướng XHCN).</li>
<li>Trong bối cảnh toàn cầu hóa kinh tế, Việt Nam tích cực, chủ động hội nhập kinh tế quốc tế.</li>
</ul>
<p><b>Tính tất yếu:</b> CNH là quy luật phổ biến của sự phát triển LLSX mà mọi quốc gia đều trải qua; đối với nước quá độ lên CNXH từ nền kinh tế kém phát triển như Việt Nam, CNH, HĐH là để xây dựng <b>cơ sở vật chất – kỹ thuật cho CNXH</b>.</p>
<p><b>Nội dung:</b></p>
<ul>
<li>Tạo lập những điều kiện để chuyển đổi từ nền sản xuất – xã hội lạc hậu sang nền sản xuất – xã hội tiến bộ.</li>
<li>Đẩy mạnh ứng dụng thành tựu KH–CN mới, hiện đại.</li>
<li><b>Chuyển đổi cơ cấu kinh tế</b> theo hướng hiện đại, hợp lý và hiệu quả (tăng tỷ trọng công nghiệp, dịch vụ; giảm tỷ trọng nông nghiệp).</li>
<li>Từng bước hoàn thiện quan hệ sản xuất phù hợp với trình độ phát triển của LLSX.</li>
<li>Sẵn sàng thích ứng với tác động của CMCN lần thứ tư: hoàn thiện thể chế, xây dựng nền kinh tế dựa trên đổi mới sáng tạo; nắm bắt và đẩy mạnh ứng dụng thành tựu CMCN 4.0; chuẩn bị nguồn nhân lực chất lượng cao.</li>
</ul>

<h3>4. Hội nhập kinh tế quốc tế</h3>
<p><b>Khái niệm:</b> hội nhập kinh tế quốc tế của một quốc gia là quá trình quốc gia đó thực hiện gắn kết nền kinh tế của mình với nền kinh tế thế giới dựa trên sự <b>chia sẻ lợi ích</b> đồng thời <b>tuân thủ các chuẩn mực quốc tế chung</b>. Xét về hình thức, đó là toàn bộ các hoạt động kinh tế đối ngoại của một nước.</p>
<p><b>Tính tất yếu:</b></p>
<ul>
<li>Do xu thế khách quan trong bối cảnh <b>toàn cầu hóa kinh tế</b> (toàn cầu hóa kinh tế là xu thế nổi trội nhất, vừa là trung tâm vừa là cơ sở của toàn cầu hóa).</li>
<li>Hội nhập là <b>phương thức phát triển phổ biến</b> của các nước, nhất là các nước đang và kém phát triển.</li>
</ul>
<p><b>Nội dung:</b> (1) chuẩn bị các điều kiện để thực hiện hội nhập (tư duy, nguồn nhân lực, thể chế, năng lực cạnh tranh…); (2) thực hiện đa dạng các hình thức, các mức độ hội nhập.</p>
<p><b>Năm mức độ hội nhập</b> (từ thấp đến cao; thứ tự đã đối chiếu, phần mô tả từng mức <span class="unv">chưa đối chiếu nguyên văn giáo trình</span>):</p>
<ol>
<li><b>Thỏa thuận thương mại ưu đãi (PTA):</b> dành cho nhau ưu đãi thương mại, chủ yếu cắt giảm thuế quan.</li>
<li><b>Khu vực mậu dịch tự do (FTA):</b> xóa bỏ thuế quan và hạn chế định lượng giữa các thành viên.</li>
<li><b>Liên minh thuế quan (CU):</b> như FTA, thêm biểu thuế quan chung với các nước ngoài khối.</li>
<li><b>Thị trường chung:</b> thêm tự do di chuyển các yếu tố sản xuất (vốn, lao động…).</li>
<li><b>Liên minh kinh tế – tiền tệ:</b> thống nhất chính sách kinh tế, dùng chung đồng tiền (ví dụ EU).</li>
</ol>
<p><b>Mốc của Việt Nam trong giáo trình:</b> Đại hội VIII (1996) chủ trương xây dựng một nền kinh tế mở, hội nhập với khu vực và thế giới; năm <b>2007</b> Việt Nam chính thức trở thành thành viên WTO.</p>

<h3>5. Tác động của hội nhập đến Việt Nam</h3>
<table><tr><th>Tích cực</th><th>Tiêu cực</th></tr>
<tr><td>Mở rộng thị trường, thúc đẩy thương mại, thu hút vốn, công nghệ; thúc đẩy chuyển dịch cơ cấu kinh tế</td><td>Gia tăng cạnh tranh gay gắt, nhiều doanh nghiệp, ngành gặp khó khăn</td></tr>
<tr><td>Nâng cao trình độ nguồn nhân lực, tiềm lực KH–CN</td><td>Gia tăng sự phụ thuộc của nền kinh tế vào thị trường bên ngoài</td></tr>
<tr><td>Ổn định kinh tế vĩ mô; thúc đẩy cải cách thể chế</td><td>Phân phối lợi ích không công bằng; nguy cơ trở thành "bãi thải công nghệ", ô nhiễm môi trường</td></tr></table>

<h3>6. Độc lập, tự chủ và phương hướng nâng cao hiệu quả hội nhập</h3>
<ul>
<li><b>Quan hệ:</b> độc lập, tự chủ là cơ sở, tiền đề cho hội nhập; hội nhập hiệu quả góp phần củng cố độc lập, tự chủ. Độc lập, tự chủ không có nghĩa là đóng cửa.</li>
<li><b>Phương hướng nâng cao hiệu quả hội nhập:</b>
<ol><li>Nhận thức đúng đắn về hội nhập kinh tế quốc tế.</li>
<li>Xây dựng chiến lược và lộ trình hội nhập phù hợp.</li>
<li>Tích cực, chủ động tham gia vào các liên kết kinh tế quốc tế và thực hiện đầy đủ các cam kết.</li>
<li>Hoàn thiện thể chế kinh tế và luật pháp.</li>
<li>Nâng cao năng lực cạnh tranh quốc tế của nền kinh tế.</li>
<li>Đảm bảo lợi ích quốc gia trong hội nhập kinh tế quốc tế.</li></ol></li>
</ul>`

  const [q,opts,a,e,fixed]=raw;
  const order=fixed?opts.map((_,i)=>i):shuffle(opts.map((_,i)=>i));
  return {ch,idx,q,opts:order.map(i=>opts[i]),ans:order.indexOf(a),exp:e,pick:null,flag:false};
}

let session=null, tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null}}

function modal(html,actions){
  const m=document.getElementById('modal'),b=document.getElementById('modalBox');
  b.innerHTML=html+'<div class="row" style="justify-content:flex-end">'+actions.map((a,i)=>`<button class="btn ${a.primary?'primary':''}" data-i="${i}">${a.label}</button>`).join('')+'</div>';
  m.classList.add('show');
  b.querySelectorAll('button[data-i]').forEach(btn=>btn.onclick=()=>{m.classList.remove('show');const f=actions[+btn.dataset.i].fn;f&&f()});
  b.querySelector('.btn.primary')?.focus();
}

// ---------- HISTORY ----------
const HIST_MAX=40;
function loadHist(){const h=store.get('history',[]);return Array.isArray(h)?h:[]}
function saveAttempt(rec){
  let h=loadHist();h.push(rec);h=h.slice(-HIST_MAX);
  // localStorage có giới hạn dung lượng: nếu đầy thì bỏ bớt lần cũ nhất
  while(h.length){try{localStorage.setItem('ktct_history',JSON.stringify(h));return true}catch(e){if(h.length===1)return false;h.shift()}}
  return false;
}
function snapshot(items){return items.map(x=>({ch:x.ch,q:x.q,o:x.opts,a:x.ans,e:x.exp,p:x.pick,f:x.flag?1:0}))}
function fmtDate(ts){const d=new Date(ts);const z=n=>String(n).padStart(2,'0');return `${z(d.getHours())}:${z(d.getMinutes())} · ${z(d.getDate())}/${z(d.getMonth()+1)}/${d.getFullYear()}`}
function recordSession(s){
  const correct=s.items.filter(x=>x.pick===x.ans).length;
  let kind,title;
  if(s.mode==='exam'){kind='exam';title='Thi thử 60 câu / 60 phút'}
  else if(!s.c.id){kind='retry';title='Làm lại câu sai của đề thi thử'}
  else if(s.items.length<s.c.qs.length){kind='retry';title='Làm lại câu sai · Chương '+s.c.id}
  else {kind='chapter';title='Chương '+s.c.id+': '+s.c.short}
  saveAttempt({id:Date.now(),kind,ch:s.c?s.c.id:0,title,at:s.end,secs:Math.round((s.end-s.start)/1000),correct,total:s.items.length,items:snapshot(s.items)});
}

function historyPage(){
  stopTimer();session=null;
  const h=loadHist().slice().reverse();
  const n=h.length, best=n?Math.max(...h.map(r=>r.correct/r.total)):0, avg=n?h.reduce((s,r)=>s+r.correct/r.total,0)/n:0;
  const exams=h.filter(r=>r.kind==='exam');
  app.innerHTML=`<div class="top"><button class="back" id="back">← Trang chủ</button><span class="eyebrow">Lịch sử làm bài</span></div>
  <h1>Lịch sử làm bài</h1>
  <p class="muted" style="margin:6px 0 14px">Lưu ${HIST_MAX} lần làm gần nhất trên trình duyệt này. Đổi máy, đổi trình duyệt hoặc xóa dữ liệu trình duyệt thì lịch sử sẽ mất.</p>
  ${n?`<div class="grid stats">
    <div class="card"><span class="muted">Số lần đã làm</span><span class="num">${n}</span></div>
    <div class="card"><span class="muted">Điểm trung bình (hệ 10)</span><span class="num">${(Math.round(avg*100)/10).toLocaleString('vi-VN')}</span></div>
    <div class="card"><span class="muted">Cao nhất (hệ 10)</span><span class="num">${(Math.round(best*100)/10).toLocaleString('vi-VN')}</span></div>
    <div class="card"><span class="muted">Số lần thi thử</span><span class="num">${exams.length}</span></div>
  </div>
  <div class="row" style="margin:14px 0">
    <label class="toggle">Lọc: <select id="flt" class="btn" style="padding:6px 10px">
      <option value="all">Tất cả</option><option value="exam">Thi thử</option>${CHAPTERS.map(c=>`<option value="${c.id}">Chương ${c.id}</option>`).join('')}<option value="retry">Làm lại câu sai</option>
    </select></label>
    <button class="btn" id="clearAll" style="margin-left:auto">Xóa toàn bộ lịch sử</button>
  </div>
  <div id="hlist"></div>`:`<div class="notes" style="padding:16px 18px">Chưa có lần làm nào. Làm xong một bài và bấm <b>Nộp bài</b>, kết quả sẽ được lưu ở đây.</div>`}`;
  app.querySelector('#back').onclick=()=>location.hash='';
  if(!n)return;
  const list=app.querySelector('#hlist');
  const draw=f=>{
    const rows=h.filter(r=>f==='all'||(f==='exam'&&r.kind==='exam')||(f==='retry'&&r.kind==='retry')||(String(r.ch)===f&&r.kind==='chapter'));
    list.innerHTML=rows.length?rows.map(r=>{const sc=r.correct/r.total;const cls=sc>=0.8?'ok':sc>=0.5?'':'bad';
      return `<div class="hrow"><div class="hmain"><div class="t">${esc(r.title)}</div><div class="muted" style="font-size:.9rem">${fmtDate(r.at)} · làm trong ${fmt(r.secs)}</div></div>
      <div class="hscore"><span class="pill ${cls}">${r.correct}/${r.total}</span><span class="muted" style="font-size:.85rem">Điểm ${ten(r.correct,r.total)}</span></div>
      <div class="row"><button class="btn primary" data-v="${r.id}">Xem lại</button><button class="btn" data-d="${r.id}" aria-label="Xóa lần làm này">Xóa</button></div></div>`}).join(''):'<p class="muted">Không có lần làm nào trong mục này.</p>';
    list.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>location.hash='xem-'+b.dataset.v);
    list.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>modal('<h2>Xóa lần làm này?</h2>',[{label:'Hủy'},{label:'Xóa',primary:true,fn:()=>{store.set('history',loadHist().filter(r=>String(r.id)!==b.dataset.d));historyPage()}}]));
  };
  const sel=app.querySelector('#flt');sel.onchange=()=>draw(sel.value);draw('all');

}

function reviewAttempt(id){
  stopTimer();session=null;
  const r=loadHist().find(x=>String(x.id)===String(id));
  if(!r){location.hash='lich-su';return}
  const items=r.items.map((x,i)=>({ch:x.ch,idx:i,q:x.q,opts:x.o,ans:x.a,exp:x.e,pick:x.p,flag:!!x.f}));
  const wrong=items.filter(x=>x.pick!==x.ans).length;
  const by=CHAPTERS.map(c=>{const its=items.filter(x=>x.ch===c.id);return its.length?`<tr><td>Chương ${c.id}: ${esc(c.short)}</td><td>${its.filter(x=>x.pick===x.ans).length}/${its.length}</td></tr>`:''}).join('');
  app.innerHTML=`<div class="top"><button class="back" id="back">← Lịch sử</button><span class="eyebrow">Xem lại bài đã làm</span></div>
  <h1>${esc(r.title)}</h1>
  <div class="result" style="margin-top:12px">
    <div class="score"><span class="big">${r.correct}/${r.total}</span><span>Điểm hệ 10: <b>${ten(r.correct,r.total)}</b></span><span class="muted">${fmtDate(r.at)} · làm trong ${fmt(r.secs)}</span></div>
    ${r.kind==='exam'||r.kind==='retry'?`<table class="breakdown">${by}</table>`:''}
    <div class="row">
      <label class="toggle"><input type="checkbox" id="onlyWrong"> Chỉ xem ${wrong} câu sai</label>
      ${items.some(x=>x.flag)?`<label class="toggle"><input type="checkbox" id="onlyFlag"> Chỉ xem ${items.filter(x=>x.flag).length} câu đã đánh dấu</label>`:''}
      ${wrong?`<button class="btn primary" id="redo" style="margin-left:auto">Làm lại ${wrong} câu sai</button>`:''}
    </div>
  </div>
  <div id="qs"></div>`;
  app.querySelector('#back').onclick=()=>location.hash='lich-su';
  const qs=app.querySelector('#qs');
  const ow=app.querySelector('#onlyWrong'), of=app.querySelector('#onlyFlag');
  const draw=()=>{const w=ow.checked,f=of&&of.checked;qs.innerHTML=items.map((it,i)=>(w&&it.pick===it.ans)||(f&&!it.flag)?'':qHTML(it,i,true)).join('')||'<p class="muted">Không có câu nào khớp bộ lọc.</p>'};
  ow.onchange=draw;if(of)of.onchange=draw;draw();
  const redo=app.querySelector('#redo');
  if(redo)redo.onclick=()=>{
    // dùng lại đúng câu hỏi đã lưu, xáo lại thứ tự đáp án
    const again=items.filter(x=>x.pick!==x.ans).map(x=>{const ord=shuffle(x.opts.map((_,k)=>k));return {ch:x.ch,idx:x.idx,q:x.q,opts:ord.map(k=>x.opts[k]),ans:ord.indexOf(x.ans),exp:x.exp,pick:null}});
    app.innerHTML=`<div class="top"><button class="back" id="back">← Lịch sử</button><span class="eyebrow">Làm lại câu sai</span></div><div id="pane"></div>`;
    app.querySelector('#back').onclick=()=>location.hash='lich-su';
    const ch=CHAPTERS.find(c=>c.id===r.ch);
    startPractice(r.kind==='chapter'&&ch?ch:{id:0,qs:[],title:'Câu sai',short:'Câu sai'},again,app.querySelector('#pane'));
    scrollTo(0,0);
  };
}
