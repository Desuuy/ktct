// ---------- CHAPTER ----------
function chapter(id,tab){
  stopTimer();
  const c=CHAPTERS.find(x=>x.id===id); if(!c) return home();
  app.innerHTML=`
  <div class="top"><button class="back" id="back">← Trang chủ</button><span class="eyebrow">Chương ${c.id}</span></div>
  <h1>${esc(c.title)}</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-notes" aria-selected="${tab==='notes'}">1. Lý thuyết</button>
    <button class="tab" role="tab" id="t-review" aria-selected="${tab==='review'}">2. Xem câu hỏi & đáp án</button>
    <button class="tab" role="tab" id="t-quiz" aria-selected="${tab==='quiz'}">3. Làm bài (${c.qs.length} câu)</button>
  </div>
  <div id="pane"></div>`;
  app.querySelector('#back').onclick=()=>location.hash='';
  app.querySelector('#t-notes').onclick=()=>chapter(id,'notes');
  app.querySelector('#t-review').onclick=()=>chapter(id,'review');
  app.querySelector('#t-quiz').onclick=()=>chapter(id,'quiz');
  const pane=app.querySelector('#pane');
  if(tab==='notes'){
    pane.innerHTML=`<div class="notes">${c.notes.replace(/<table>/g,'<div class="tablewrap"><table>').replace(/<\/table>/g,'</table></div>')}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="next">Đọc xong, xem câu hỏi & đáp án</button></div>`;
    pane.querySelector('#next').onclick=()=>{chapter(id,'review');scrollTo(0,0)};
  } else if(tab==='review'){
    renderReview(c,pane,store.get('hideAns',false));
  } else {
    startPractice(c,c.qs.map((r,i)=>inst(c.id,r,i)),pane);
  }
}

function renderReview(c,pane,hide){
  const items=c.qs.map((r,i)=>inst(c.id,r,i));
  pane.innerHTML=`
  <div class="bar">
    <span class="muted">${items.length} câu kèm đáp án đúng và giải thích. Đọc hết rồi chuyển sang làm bài.</span>
    <label class="toggle"><input type="checkbox" id="hide" ${hide?'checked':''}> Che đáp án để tự đoán trước</label>
  </div>
  ${items.map((it,i)=>`<div class="q" id="r${i}"><div class="qh"><span class="qn">Câu ${i+1}.</span><span class="qt">${esc(it.q)}</span></div>
    <div class="opts">${it.opts.map((o,j)=>`<div class="opt ${!hide&&j===it.ans?'right':''}" data-r="${i}" data-o="${j}"><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span></div>`).join('')}</div>
    ${hide?`<button class="btn reveal" data-r="${i}" style="margin-top:10px">Xem đáp án</button><div class="exp" hidden><b>Đáp án: ${LETTERS[it.ans]}.</b> ${esc(it.exp)}</div>`:`<div class="exp"><b>Đáp án: ${LETTERS[it.ans]}.</b> ${esc(it.exp)}</div>`}
  </div>`).join('')}
  <div class="row"><button class="btn primary" id="toQuiz">Đã xem xong, vào làm bài</button></div>`;
  pane.querySelector('#hide').onchange=e=>{store.set('hideAns',e.target.checked);renderReview(c,pane,e.target.checked)};
  pane.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.r,box=document.getElementById('r'+i);
    box.querySelector('.opt[data-o="'+items[i].ans+'"]').classList.add('right');
    box.querySelector('.exp').hidden=false;b.remove();
  });
  pane.querySelector('#toQuiz').onclick=()=>{chapter(c.id,'quiz');scrollTo(0,0)};
}

function startPractice(c,items,pane){
  session={mode:'practice',c,items,start:Date.now(),instant:store.get('instant',false),done:false,pane};
  renderPractice();
  tick=setInterval(()=>{const t=document.getElementById('timer');if(t&&session&&!session.done)t.textContent=fmt((Date.now()-session.start)/1000)},1000);
}

function renderPractice(){
  const s=session,p=s.pane;
  p.innerHTML=quizLayout(s);
  bindQuiz(s,finishPractice);
}

function finishPractice(){
  const s=session;s.done=true;s.end=Date.now();
  const correct=s.items.filter(x=>x.pick===x.ans).length;
  if(s.items.length===s.c.qs.length){const best=store.get('best',{});if(best[s.c.id]==null||correct>best[s.c.id]){best[s.c.id]=correct;store.set('best',best)}}
  recordSession(s);
  renderPractice();scrollTo(0,0);
}

// ---------- QUIZ LAYOUT (dùng chung cho luyện tập & thi thử) ----------
function qHTML(it,i,reveal){
  const s=session, live=s&&!s.done&&s.items&&s.items[i]===it;
  const chTag=s&&s.mode==='exam'?`<span class="tag">Chương ${it.ch}</span>`:'';
  return `<div class="q${it.flag?' flagged':''}" id="q${i}">
  <div class="qh"><span class="qn">Câu ${i+1}</span>${chTag}${it.flag&&!live?'<span class="tag flag">Đã đánh dấu</span>':''}</div>
  <div class="qt">${esc(it.q)}</div>
  <div class="opts">${it.opts.map((o,j)=>{
    let cls='opt';
    if(reveal){if(j===it.ans)cls+=' right';else if(j===it.pick)cls+=' wrong'}
    else if(j===it.pick)cls+=' sel';
    return `<button class="${cls}" data-q="${i}" data-o="${j}" ${reveal?'disabled':''}><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
  ${reveal?`<div class="exp"><b>${it.pick===it.ans?'Đúng rồi.':it.pick===null?'Bỏ trống.':'Chưa đúng.'}</b> Đáp án: <b>${LETTERS[it.ans]}</b>. ${esc(it.exp)}</div>`:''}
  ${live?`<label class="flagbox"><span>Lát kiểm tra lại</span><input type="checkbox" data-flag="${i}" ${it.flag?'checked':''}><i aria-hidden="true"></i></label>`:''}
  </div>`;
}

function cellClass(s,it){
  if(s.done)return (it.pick===it.ans?'r':'w')+(it.flag?' fl':'');
  if(it.flag)return 'fl';
  return it.pick!==null?'done':'';
}

function panelHTML(s){
  const n=s.items.length, answered=s.items.filter(x=>x.pick!==null).length, flagged=s.items.filter(x=>x.flag).length;
  const isExam=s.mode==='exam';
  const timeLabel=s.done?'Thời gian làm':isExam?'Thời gian còn lại':'Thời gian';
  const timeVal=s.done?fmt((s.end-s.start)/1000):isExam?fmt(EXAM_SEC-(Date.now()-s.start)/1000):fmt((Date.now()-s.start)/1000);
  const legend=s.done
    ?`<li><i class="dot r"></i>Câu đúng</li><li><i class="dot w"></i>Câu sai / bỏ trống</li><li><i class="dot fl ring"></i>Câu đã đánh dấu</li>`
    :`<li><i class="dot done"></i>Câu đã làm</li><li><i class="dot"></i>Câu chưa làm</li><li><i class="dot fl"></i>Câu cần kiểm tra lại</li>`;
  return `<aside class="panel" aria-label="Bảng điều khiển bài làm">
    <div class="stats2">
      <div><span>Số câu đã làm</span><b id="pAnswered">${answered}/${n}</b></div>
      <div><span>${timeLabel}</span><b id="timer" class="${!s.done&&isExam&&EXAM_SEC-(Date.now()-s.start)/1000<300?'warn':''}">${timeVal}</b></div>
    </div>
    <details class="gridwrap" id="gridwrap" open>
      <summary>Bảng câu hỏi <span class="muted" id="pFlagged">${flagged?`· ${flagged} câu đánh dấu`:''}</span></summary>
      <div class="navgrid">${s.items.map((it,i)=>`<button class="${cellClass(s,it)}" data-go="${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div>
      <ul class="legend">${legend}</ul>
    </details>
    ${!s.done&&!isExam?`<label class="toggle"><input type="checkbox" id="instant" ${s.instant?'checked':''}> Hiện đáp án ngay sau mỗi câu</label>`:''}
    ${s.done?'':'<button class="btn primary submitbtn" id="submit">Nộp bài</button>'}
  </aside>`;
}

function quizLayout(s){
  const reveal=it=>s.done||(s.mode==='practice'&&s.instant&&it.pick!==null);
  return `${s.done?resultBlock():''}
  <div class="quiz">
    <div class="qcol"><div id="qs">${s.items.map((it,i)=>qHTML(it,i,reveal(it))).join('')}</div>
      ${s.done?'':'<div class="row" style="justify-content:flex-end"><button class="btn primary" id="submit2">Nộp bài</button></div>'}
    </div>
    ${panelHTML(s)}
  </div>`;
}

function refreshPanel(){
  const s=session;if(!s)return;
  const answered=s.items.filter(x=>x.pick!==null).length, flagged=s.items.filter(x=>x.flag).length;
  const a=document.getElementById('pAnswered');if(a)a.textContent=answered+'/'+s.items.length;
  const f=document.getElementById('pFlagged');if(f)f.textContent=flagged?`· ${flagged} câu đánh dấu`:'';
  app.querySelectorAll('.navgrid [data-go]').forEach(b=>{b.className=cellClass(s,s.items[+b.dataset.go])});
}

function bindQs(){
  const s=session;
  app.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q,it=s.items[i];it.pick=+b.dataset.o;
    const reveal=s.mode==='practice'&&s.instant;
    document.getElementById('q'+i).outerHTML=qHTML(it,i,reveal);
    bindQs();refreshPanel();
  });
  app.querySelectorAll('[data-flag]').forEach(c=>c.onchange=()=>{
    const i=+c.dataset.flag;s.items[i].flag=c.checked;
    document.getElementById('q'+i).classList.toggle('flagged',c.checked);
    refreshPanel();
  });
}
function updateBar(){refreshPanel()}

function bindQuiz(s,finishFn){
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    document.getElementById('q'+b.dataset.go).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
    if(matchMedia('(max-width: 899px)').matches){const g=document.getElementById('gridwrap');if(g)g.open=false}
  });
  bindQs();
  if(matchMedia('(max-width: 899px)').matches){const g=document.getElementById('gridwrap');if(g&&!s.done)g.open=false}
  if(s.done){bindResult();return}
  const ins=app.querySelector('#instant');
  if(ins)ins.onchange=e=>{s.instant=e.target.checked;store.set('instant',s.instant);renderPractice()};
  const sub=()=>{
    const left=s.items.filter(x=>x.pick===null).length, fl=s.items.filter(x=>x.flag).length;
    const lines=[];
    if(left)lines.push(`Còn <b>${left}</b> câu chưa làm (tính là sai).`);
    if(fl)lines.push(`Còn <b>${fl}</b> câu đang đánh dấu <b>cần kiểm tra lại</b>.`);
    if(!lines.length)lines.push(`Đã làm hết ${s.items.length} câu.`);
    modal(`<h2>Nộp bài?</h2><p style="margin:0">${lines.join('<br>')}${s.mode==='exam'?'<br>Nộp xong sẽ không sửa được nữa.':''}</p>`,
      [{label:fl?'Xem lại câu đánh dấu':'Làm tiếp',fn:fl?()=>{const k=s.items.findIndex(x=>x.flag);document.getElementById('q'+k).scrollIntoView({block:'start'})}:null},{label:'Nộp bài',primary:true,fn:finishFn}]);
  };
  app.querySelector('#submit').onclick=sub;app.querySelector('#submit2').onclick=sub;
}

function resultBlock(){
  const s=session,n=s.items.length,correct=s.items.filter(x=>x.pick===x.ans).length,wrong=n-correct;
  const secs=(s.end-s.start)/1000;
  let breakdown='';
  if(s.mode==='exam'){
    breakdown=`<table class="breakdown">${CHAPTERS.map(c=>{const its=s.items.filter(x=>x.ch===c.id);if(!its.length)return '';const k=its.filter(x=>x.pick===x.ans).length;return `<tr><td>Chương ${c.id}: ${esc(c.short)}</td><td>${k}/${its.length}</td></tr>`}).join('')}</table>`;
  }
  return `<div class="result">
    <div class="score"><span class="big">${correct}/${n}</span><span>Điểm hệ 10: <b>${ten(correct,n)}</b></span><span class="muted">Thời gian làm: ${fmt(secs)}</span></div>
    ${breakdown}
    <div class="row">
      ${wrong?`<button class="btn primary" id="retryWrong">Làm lại ${wrong} câu sai</button>`:''}
      <button class="btn" id="retryAll">${s.mode==='exam'?'Thi đề mới':'Làm lại cả chương'}</button>
      <button class="btn" id="histBtn">Lịch sử làm bài</button>
      <button class="btn" id="home2">Về trang chủ</button>
    </div>
    <p class="muted" style="margin:0;font-size:.92rem">Kéo xuống để xem đáp án và giải thích từng câu.</p>
  </div>`;
}

function bindResult(){
  const s=session;
  app.querySelector('#home2').onclick=()=>location.hash='';
  app.querySelector('#histBtn').onclick=()=>location.hash='lich-su';
  app.querySelector('#retryAll').onclick=()=>{if(s.mode==='exam')exam(true);else chapter(s.c.id,'quiz')};
  const rw=app.querySelector('#retryWrong');
  if(rw)rw.onclick=()=>{
    const wrong=s.items.filter(x=>x.pick!==x.ans).map(x=>inst(x.ch,CHAPTERS.find(c=>c.id===x.ch).qs[x.idx],x.idx));
    stopTimer();
    if(s.mode==='exam'){
      app.innerHTML=`<div class="top"><button class="back" id="back">← Trang chủ</button><span class="eyebrow">Ôn lại câu sai trong đề thi</span></div><div id="pane"></div>`;
      app.querySelector('#back').onclick=()=>location.hash='';
      startPractice({id:0,qs:[],title:'Câu sai'},wrong,app.querySelector('#pane'));
    } else {startPractice(s.c,wrong,s.pane)}
    scrollTo(0,0);
  };
}

// ---------- EXAM ----------
const EXAM_N=60, EXAM_SEC=60*60, PER_CH=10;
function exam(fresh){
  stopTimer();
  if(!fresh && session && session.mode==='exam'){renderExam();return}
  app.innerHTML=`<div class="top"><button class="back" id="back">← Trang chủ</button><span class="eyebrow">Phòng thi thử</span></div>
  <h1>Thi thử 60 câu / 60 phút</h1>
  <div class="notes" style="margin-top:14px;padding:16px 18px">
    <p style="margin-top:0">Đề gồm ${EXAM_N} câu, mỗi chương ${PER_CH} câu chọn ngẫu nhiên, thứ tự câu và đáp án được xáo trộn. Mỗi lần vào là một đề mới.</p>
    <ul><li>Đồng hồ đếm ngược 60 phút, hết giờ bài tự nộp.</li><li>Trong lúc thi không hiện đáp án. Nộp bài xong mới xem điểm, đáp án và giải thích.</li><li>Bấm số câu ở bảng bên phải để nhảy nhanh tới câu đó. Câu nào chưa chắc thì tích <b>Lát kiểm tra lại</b>, ô số câu sẽ chuyển màu tím để quay lại sau.</li></ul>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn primary" id="begin">Bắt đầu tính giờ</button></div>`;
  app.querySelector('#back').onclick=()=>location.hash='';
  app.querySelector('#begin').onclick=()=>{
    let items=[];
    CHAPTERS.forEach(c=>{shuffle(c.qs.map((_,i)=>i)).slice(0,PER_CH).forEach(i=>items.push(inst(c.id,c.qs[i],i)))});
    session={mode:'exam',items:shuffle(items),start:Date.now(),done:false};
    renderExam();
    tick=setInterval(()=>{
      if(session.done)return;
      const left=EXAM_SEC-(Date.now()-session.start)/1000;
      const t=document.getElementById('timer');
      if(t){t.textContent=fmt(left);t.classList.toggle('warn',left<300)}
      if(left<=0){finishExam(true)}
    },500);
  };
}

function renderExam(){
  const s=session;
  app.innerHTML=`<div class="top"><button class="back" id="back">← Trang chủ</button><span class="eyebrow">Phòng thi thử · 60 câu / 60 phút</span></div>
  ${quizLayout(s)}`;
  app.querySelector('#back').onclick=()=>{
    if(!s.done)modal('<h2>Rời phòng thi?</h2><p style="margin:0">Bài đang làm sẽ bị hủy.</p>',[{label:'Ở lại'},{label:'Rời đi',primary:true,fn:()=>{stopTimer();session=null;location.hash=''}}]);
    else location.hash='';
  };
  bindQuiz(s,()=>finishExam(false));
}

function finishExam(auto){
  const s=session;if(s.done)return;
  s.done=true;s.end=Math.min(Date.now(),s.start+EXAM_SEC*1000);stopTimer();
  const score=s.items.filter(x=>x.pick===x.ans).length;
  const ex=store.get('exams',[]);ex.push({score,at:Date.now()});store.set('exams',ex.slice(-20));
  recordSession(s);
  document.getElementById('modal').classList.remove('show');
  renderExam();scrollTo(0,0);
  if(auto)modal('<h2>Hết giờ!</h2><p style="margin:0">Bài đã được nộp tự động.</p>',[{label:'Xem kết quả',primary:true}]);
}

// ---------- ROUTER ----------
function route(){
  const h=location.hash.slice(1);
  let m=h.match(/^chuong-(\d)$/);
  if(m){chapter(+m[1],'notes');scrollTo(0,0);return}
  if(h==='thi-thu'){exam(false);scrollTo(0,0);return}
  if(h==='lich-su'){historyPage();scrollTo(0,0);return}
  m=h.match(/^xem-(\d+)$/);
  if(m){reviewAttempt(m[1]);scrollTo(0,0);return}
  home();
}
addEventListener('hashchange',route);
route();
})();
</script>
